[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecobee-hk"
version = "0.1.0"
description = "Local (HomeKit) CLI and Omarchy bar widget for ecobee thermostats"
requires-python = ">=3.11"
dependencies = ["aiohomekit>=3.2"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ecobee = "ecobee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
