[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thermoslop"
version = "0.1.0"
description = "Unofficial local HomeKit control for ecobee thermostats: CLI, MCP server, Omarchy bar widget"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["aiohomekit>=3.2", "mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
thermoslop = "thermoslop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
