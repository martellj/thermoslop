[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thermoslop"
dynamic = ["version"]
description = "Unofficial local HomeKit control for ecobee thermostats: CLI, MCP server, Omarchy bar widget"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Martell" }]
requires-python = ">=3.11"
dependencies = ["aiohomekit>=3.2", "mcp>=2.3,<3"]
keywords = ["homekit", "ecobee", "thermostat", "mcp", "omarchy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/martellj/thermoslop"
Issues = "https://github.com/martellj/thermoslop/issues"
Changelog = "https://github.com/martellj/thermoslop/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
thermoslop = "thermoslop.cli:main"

[tool.setuptools.dynamic]
version = { attr = "thermoslop.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
