name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python scripts/check-version

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check-dist dist
      - run: python scripts/check-plugin

  # Windows isn't supported yet (openspec windows-integration): this job
  # reports what breaks without failing CI.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider -rf --tb=line --continue-on-collection-errors
        continue-on-error: true
      - name: Smoke
        shell: bash
        run: |
          thermoslop --version
          thermoslop discover --demo
          echo 314-15-926 | thermoslop pair Basement --demo
          thermoslop bar --format waybar
