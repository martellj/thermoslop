# Builds the docs site (https://thermoslop.com) from docs/ and deploys it to
# GitHub Pages. Pull requests only build and check it. Deploying needs Pages
# enabled (Settings → Pages → Source: GitHub Actions) and the repository
# variable DOCS_DEPLOY=true; until then the site is only built and checked.
name: Docs

on:
  push:
    branches: [main]
    paths: &docs-paths
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "src/thermoslop/cli.py"
      - "src/thermoslop/cli_help.py"
      - "scripts/gen-cli-docs"
      - "scripts/docs_hooks.py"
      - "scripts/check-docs-site"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[docs]'
      # --strict fails on broken links, missing anchors and pages left out of the nav;
      # the build hook regenerates the CLI reference from the parser first.
      - run: mkdocs build --strict
      - run: python scripts/check-docs-site site
      - if: github.event_name != 'pull_request' && vars.DOCS_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && vars.DOCS_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
